name: registry consumer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/registry-consumer.yml
      - package.json
      - pnpm-lock.yaml
      - scripts/registry-consumer-plan.mjs
      - scripts/registry-consumer-plan.test.mjs
      - scripts/packed-smoke.mjs
      - scripts/release-readiness.mjs
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version or dist-tag (empty selects active channels)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: registry-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Resolve active registry channels
        id: matrix
        env:
          REGISTRY_SMOKE_VERSION: ${{ inputs.version }}
        run: node scripts/registry-consumer-plan.mjs

  consume:
    needs: plan
    name: consume npm ${{ matrix.channel }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install harness dependencies
        run: pnpm install --frozen-lockfile

      - name: Consume published package
        env:
          REGISTRY_SMOKE_VERSION: ${{ matrix.version }}
        run: pnpm run registry-smoke
