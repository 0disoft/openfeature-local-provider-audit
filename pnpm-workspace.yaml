packages:
  - "packages/*"
  - "examples/*"
overrides:
  esbuild: ^0.28.2
  # Security floors until all tooling resolves patched versions without overrides.
  vite: ^8.1.6
  source-map-js: ^1.2.2
allowBuilds:
  esbuild: true
  # Optional platform binary is already installed; the CLI resolves it directly.
  workerd: false
minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1001.7"
  - "@aws-sdk/client-s3@3.1159.0"
  - "@aws-sdk/core@3.978.7"
  - "@aws-sdk/credential-provider-env@3.972.78"
  - "@aws-sdk/credential-provider-http@3.972.80"
  - "@aws-sdk/credential-provider-ini@3.973.23"
  - "@aws-sdk/credential-provider-login@3.972.85"
  - "@aws-sdk/credential-provider-node@3.972.90"
  - "@aws-sdk/credential-provider-process@3.972.78"
  - "@aws-sdk/credential-provider-sso@3.973.22"
  - "@aws-sdk/credential-provider-web-identity@3.972.84"
  - "@aws-sdk/middleware-sdk-s3@3.972.83"
  - "@aws-sdk/nested-clients@3.997.52"
  - "@aws-sdk/signature-v4-multi-region@3.996.50"
  - "@aws-sdk/token-providers@3.1159.0"
  - "@aws-sdk/xml-builder@3.972.42"
  - "@biomejs/biome@2.6.4"
  - "@biomejs/cli-android-arm64@2.6.4"
  - "@biomejs/cli-android-x64@2.6.4"
  - "@biomejs/cli-darwin-arm64@2.6.4"
  - "@biomejs/cli-darwin-x64@2.6.4"
  - "@biomejs/cli-linux-arm64-musl@2.6.4"
  - "@biomejs/cli-linux-arm64@2.6.4"
  - "@biomejs/cli-linux-x64-musl@2.6.4"
  - "@biomejs/cli-linux-x64@2.6.4"
  - "@biomejs/cli-win32-arm64@2.6.4"
  - "@biomejs/cli-win32-x64@2.6.4"
  - "@cloudflare/workerd-darwin-64@1.20261029.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261029.1"
  - "@cloudflare/workerd-linux-64@1.20261029.1"
  - "@cloudflare/workerd-linux-arm64@1.20261029.1"
  - "@cloudflare/workerd-windows-64@1.20261029.1"
  - workerd@1.20261029.1
